name: Benchmarks

# The scale rungs take longer than a pull request should wait, so they run on
# request. Pull requests run the smoke rung as part of `blueprint run check`.
on:
  workflow_dispatch:

permissions: {}

jobs:
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install blueprint
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@0ad737abd3cad3d14d7e409e91161cd42c05142c
        with:
          cache: 'true'
          cache-workload: dev

      - name: Install the latest Roc nightly
        uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
        with:
          version: nightly

      - name: Admit the fixed build dependencies before Blueprint evaluation
        run: |
          raw="$RUNNER_TEMP/graph-release-sources"
          python3 scripts/admit_release_sources.py prepare --raw-dir "$raw" --source core --source font --source basic-cli --source legacy-http
          python3 scripts/admit_release_sources.py seed --raw-dir "$raw" --source core --source font --source basic-cli --source legacy-http
          echo "GRAPH_RELEASE_SOURCES_DIR=$raw" >> "$GITHUB_ENV"

      - name: Run the scale rungs
        run: blueprint run bench -- scale --output benchmarks/results/manual

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-scale
          path: benchmarks/results/manual
          if-no-files-found: warn
