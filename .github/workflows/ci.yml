name: CI

# Every pull request runs the checks a contributor runs locally with
# `blueprint run check`, against the latest Roc nightly: dev builds, with smoke
# runs of the benchmarks and fuzz targets.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  # TODO: remove this temporary opt-in after roc-lang/roc#12677 and the
  # remaining Datastar inference errors are resolved. Other checks stay on.
  RUN_NODE_EDITOR_CHECKS: ${{ vars.RUN_NODE_EDITOR_CHECKS || '0' }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # These names are required status checks in the branch ruleset.
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install blueprint
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@3d0de80181b04e0549e15955672746fb56f622e4
        with:
          cache: 'true'
          cache-workload: dev

      - name: Install the latest Roc nightly
        uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
        with:
          version: nightly
          download-method: asset-api

      - name: Admit the fixed build dependencies before Blueprint evaluation
        run: |
          raw="$RUNNER_TEMP/graph-release-sources"
          python3 scripts/admit_release_sources.py prepare --raw-dir "$raw" --source font --source basic-cli --source legacy-http
          python3 scripts/admit_release_sources.py seed --raw-dir "$raw" --source font --source basic-cli --source legacy-http
          echo "GRAPH_RELEASE_SOURCES_DIR=$raw" >> "$GITHUB_ENV"

      - name: Check Blueprint.roc
        run: blueprint check

      - name: Check the scripts, package, examples, benchmarks and release artifacts
        run: blueprint run check

  editor-e2e:
    # TODO: restore after roc-lang/roc#12677 and the remaining Datastar
    # inference errors are resolved; their common cause is not yet confirmed.
    # Keep the required check name, with an explicit skipped conclusion.
    if: ${{ vars.RUN_NODE_EDITOR_CHECKS == '1' }}
    # This name is a required status check in the branch ruleset.
    name: Node editor browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install blueprint
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@3d0de80181b04e0549e15955672746fb56f622e4
        with:
          cache: 'true'
          cache-workload: dev

      - name: Install the latest Roc nightly
        uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
        with:
          version: nightly
          download-method: asset-api

      - name: Build the node editor and run its browser tests
        env:
          PLAYWRIGHT_WITH_DEPS: "1"
        run: blueprint run editor-e2e

  mermaid-oracle:
    name: Mermaid independent oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest Roc nightly
        uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
        with:
          version: nightly
          download-method: asset-api

      - name: Admit the fixed dependencies for the native oracle
        run: python3 scripts/admit_release_sources.py seed --source font --source basic-cli --source legacy-http

      - name: Install pinned oracle and browser dependencies
        run: |
          node --version
          sudo apt-get update
          sudo apt-get install -y libnspr4 libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libasound2t64 fonts-noto-color-emoji fonts-noto-cjk
          npm ci --prefix tools/mermaid-oracle

      - name: Test the comparison contract
        run: node --test tools/mermaid-oracle/validate.test.mjs tools/mermaid-oracle/boundaries.test.mjs

      - name: Generate independent references for the runner's font environment
        run: |
          node tools/mermaid-oracle/oracle.mjs record --force tests/mermaid/flowchart tests/mermaid/layout tests/mermaid/measure tests/mermaid/themed tests/mermaid/sequence tests/mermaid/entity tests/mermaid/class tests/mermaid/state
          node tools/mermaid-oracle/oracle.mjs check tests/mermaid/flowchart tests/mermaid/layout tests/mermaid/measure tests/mermaid/themed tests/mermaid/sequence tests/mermaid/entity tests/mermaid/class tests/mermaid/state

      - name: Build the native production-path probe
        run: |
          mkdir -p "${{ runner.temp }}/mermaid-oracle-results"
          roc version > "${{ runner.temp }}/mermaid-oracle-results/compiler.txt"
          roc build package-mermaid/oracle_dump.roc --output="${{ runner.temp }}/mermaid-oracle-dump"

      - name: Exercise failure gates against the real native CLI
        env:
          ORACLE_DUMP: ${{ runner.temp }}/mermaid-oracle-dump
        run: node --test tools/mermaid-oracle/validate.integration.test.mjs

      - name: Compare every supported diagram family
        run: node tools/mermaid-oracle/validate.mjs "${{ runner.temp }}/mermaid-oracle-dump" "${{ runner.temp }}/mermaid-oracle-results"

      - name: Preserve scores, SVGs and difference images even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mermaid-oracle-results
          path: ${{ runner.temp }}/mermaid-oracle-results
          if-no-files-found: warn
