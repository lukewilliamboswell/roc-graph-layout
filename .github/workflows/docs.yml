name: Docs

# Build the documentation site on every pull request, and deploy it from the
# default branch. The site leads with the latest final release: the API
# reference of every release is restored from its docs archive, `docs/` leads
# to the newest, and the default branch's own reference is under `docs/main/`.
# The release workflow calls this after publishing, so the site follows a new
# release at once.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      nightly-tag:
        description: "Roc nightly already resolved by the release caller; empty uses latest"
        type: string
        default: ''
  workflow_dispatch:

permissions: {}

jobs:
  build-site:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the caller's Roc nightly, or latest
        # TODO: https://github.com/roc-lang/setup-roc/issues/12
        # Restore asset-api after verified cold compiler API downloads pass.
        uses: roc-lang/setup-roc@1dda09db455688e0f3612d509f3e4982b0e00ff6
        with:
          version: nightly
          download-method: verified-browser
          nightly-tag: ${{ inputs.nightly-tag }}

      # TODO: https://github.com/lukewilliamboswell/roc-automation/issues/152
      # Remove this pre-admission and restore the original setup order after
      # setup-blueprint reliably admits the fixed Core source on cold runners.
      - name: Admit verified Blueprint Core before setup
        run: python3 scripts/admit_release_sources.py seed --source core

      - name: Install blueprint
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@6c796f299012707d2e9bad23fd6449ed93f1f475

      - name: Admit the fixed build dependencies before Blueprint evaluation
        run: |
          raw="$RUNNER_TEMP/graph-release-sources"
          python3 scripts/admit_release_sources.py prepare --raw-dir "$raw" --source font --source basic-cli --source legacy-http
          python3 scripts/admit_release_sources.py seed --raw-dir "$raw" --source font --source basic-cli --source legacy-http
          echo "GRAPH_RELEASE_SOURCES_DIR=$raw" >> "$GITHUB_ENV"

      - name: Build the guides and the API reference of each release
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_RELEASE_DOCS: "1"
          SITE_VERSION: main
          SITE_OUTPUT: dist/site
        run: blueprint run site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  # Holds the Pages permissions, checks out nothing, and deploys the artifact
  # the job above built.
  deploy-pages:
    name: Deploy the site
    needs: build-site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
