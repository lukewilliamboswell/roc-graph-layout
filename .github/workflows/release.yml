name: Release

# Run by hand with a version to publish a release. A pull request runs the same
# build and tests as a dry run, under a version that is never published.
#
# Everything a release holds is built once, tested as those exact files, and
# only then published. Nothing pins the package compiler: the release is built
# and tested with the latest Roc nightly, and its notes record which one.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. 0.2.0, or 0.2.0-rc1 for a release candidate"
        required: true
        type: string
      skip_api_comparison:
        description: "Skip roc bump, only when the previous release no longer compiles; say so in the notes"
        type: boolean
        default: false
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-dry-run-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    # This name is a required status check in the branch ruleset.
    name: Build release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
      nightly_tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - name: Require the default branch for publication
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF_TYPE" = branch && test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" || { echo "Releases must run from the default branch" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Resolved once here, so every job of this run uses the same compiler.
      - name: Resolve the latest Roc nightly
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Install blueprint
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          cache: 'true'
          cache-workload: dev

      - name: Install the latest Roc nightly
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.nightly.outputs.tag }}

      # Rejects a version whose tag or release already exists.
      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          # Roc rejects 0.0.0 in a package URL, so this is the lowest version.
          dry_run_version: 0.0.1-dry-run
          github_token: ${{ github.token }}

      # Stops a version that understates what changed in the layout package's
      # API since the latest release. A dry run has no version to check.
      - name: Check the version with roc bump
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
          SKIP_API_COMPARISON: ${{ inputs.skip_api_comparison && '1' || '' }}
        run: blueprint run check-version

      - name: Check the scripts, package, examples and release artifacts
        run: blueprint run check

      # The layout package, then the Mermaid package, which depends on the
      # layout bundle by its URL in this release: version and bundle name fix
      # it before the release exists.
      - name: Bundle the packages
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: blueprint run bundle

      # The archived examples depend on this release's bundle URLs.
      - name: Package the examples archive
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: blueprint run package-examples

      - name: Package the API reference and the guide's PDF
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: blueprint run package-docs

      # Renders docs/releases/<version>.md with the real bundle URLs and the
      # compilers used. A dry run renders the newest notes there are.
      - name: Render the release notes
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: blueprint run release-notes

      # Everything the release would hold, and its notes: both bundles match
      # *.tar.zst. Later jobs use these files and build nothing.
      - name: Upload the release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: |
            dist/*.tar.zst
            dist/roc-graph-layout-examples-*.zip
            dist/roc-graph-layout-docs-*.zip
            dist/roc-graph-layout-*.pdf
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  test-bundle:
    # This name is a required status check in the branch ruleset.
    name: Test release examples
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install blueprint
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6

      - name: Install the Roc nightly this run resolved
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.build.outputs.nightly_tag }}

      - name: Download the release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist

      # The archive names the release URLs of the bundles, which do not exist
      # yet: the bundles are served from a loopback address in their place.
      - name: Test the examples archive, unchanged, against the bundles
        run: blueprint run test-bundle

  # Holds the write token, checks out nothing, and runs no code from this
  # repository: it publishes the files the jobs above built and tested.
  publish:
    name: Publish GitHub release
    needs:
      - build
      - test-bundle
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - name: Download the release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: candidate

      # Stages a draft, downloads every asset back and compares it with the
      # tested file, and only then publishes the release.
      - name: Publish the tested assets
        uses: lukewilliamboswell/roc-automation/actions/publish-release@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          version: ${{ needs.build.outputs.release_version }}
          prerelease: ${{ needs.build.outputs.is_prerelease }}
          notes-file: candidate/release-notes.md
          assets: |
            candidate/*.tar.zst
            candidate/roc-graph-layout-examples-*.zip
            candidate/roc-graph-layout-docs-*.zip
            candidate/roc-graph-layout-*.pdf

  # A final release changes which release the API reference leads with, so
  # the site is rebuilt. A release candidate does not change the site.
  site:
    name: Site
    needs:
      - build
      - publish
    if: needs.build.outputs.is_prerelease != 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
