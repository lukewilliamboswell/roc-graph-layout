name: Tests

on:
  pull_request:
  workflow_dispatch:

# this cancels workflows currently in progress if you start a new one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Do not add permissions here! Configure them at the job level!
permissions: {}

jobs:
  test:
    name: scripts/all.roc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false

      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - run: roc version

      - name: Run all tests
        run: ROC=roc roc scripts/all.roc

      - name: Run performance harness smoke cases
        run: ROC=roc python3 benchmarks/run.py smoke --output benchmarks/results/ci

      - name: Check example outputs are up to date
        run: |
          if ! git diff --exit-code -- ':(glob)examples/**/output.svg'; then
            echo "::error::Example output changed — regenerate and commit the golden files listed above."
            exit 1
          fi
