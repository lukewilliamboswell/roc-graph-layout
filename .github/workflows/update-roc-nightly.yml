name: Update Roc nightly
on:
  schedule:
    # Once daily, about four hours after the upstream 09:00 UTC build.
    - cron: "13 13 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: roc-nightly-update
  cancel-in-progress: false
jobs:
  update:
    # Ceiling only: the reusable workflow narrows permissions per job.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/update-roc-nightly.yml@0b4595a2fca0630b3a9df4797f8c7a58aec0b2dc
